version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amemployer_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amemployer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amemployer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-amemployer_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amemployer']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amemployer_redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: amemployer_backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-amemployer}:${POSTGRES_PASSWORD:-amemployer_secret}@postgres:5432/${POSTGRES_DB:-amemployer_db}
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: amemployer_frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4000
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
